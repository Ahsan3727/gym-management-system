<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff4e1f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Ironline Gym Management Platform — Multi-tenant fitness, workouts, nutrition and membership tracking." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- PERF FIX: Google Fonts moved here from a CSS @import (see
         src/index.css for why @import was slow). preconnect lets the
         browser open the connection to Google's font servers immediately
         while the rest of the HTML is still parsing, in parallel with the
         app's own JS/CSS — the stylesheet link then only needs one more
         request instead of the old three-hop chain. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    />
    <title>Ironline · Gym Management</title>
    <script>
      // Apply the saved theme before React mounts / CSS paints, so a user
      // who picked "light" doesn't see a flash of the (now default) dark
      // theme on reload. Dark needs no class — it's the :root default.
      (function () {
        try {
          if (localStorage.getItem('ironline_theme') === 'light') {
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
