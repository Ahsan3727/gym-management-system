name: Build frontend for Hyperlift

on:
  push:
    # Change this word if Hyperlift deploys from a different branch (e.g. main)
    branches: [main]
    paths:
      - 'frontend/**'
      - '!frontend/dist/**'
      - '.github/workflows/build-frontend.yml'
  workflow_dispatch:   # lets you also run it manually from the Actions tab

permissions:
  contents: write      # needed so the workflow can save frontend/dist to the branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Save built files (frontend/dist) to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f frontend/dist
          if git diff --cached --quiet; then
            echo "No changes in frontend/dist"
          else
            git commit -m "Build frontend for Hyperlift"
            git push
          fi
