<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff4e1f" />
    <meta name="description" content="Ironline Gym Management Platform — staff console for admins, trainers, and the platform team." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Ironline · Staff Console</title>
    <script>
      // Apply the saved theme before React mounts / CSS paints, so a user
      // who picked "light" doesn't see a flash of the (now default) dark
      // theme on reload. Dark needs no class — it's the :root default.
      (function () {
        try {
          if (localStorage.getItem('ironline_theme') === 'light') {
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
